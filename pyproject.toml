[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lankalistings-media-service"
version = "0.1.0"
description = "FastAPI media processing service for LankaListings image OCR and extraction."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2.0",
  "fastapi>=0.115,<1.0",
  # Runtime, not just test: the LLM adapters call providers over HTTP with a sync client.
  "httpx>=0.27,<1.0",
  "pillow>=10.4,<12.0",
  "psycopg[binary]>=3.1,<4.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "python-ulid>=2.2,<4.0",
  "sqlalchemy>=2.0.30,<3.0",
  "uvicorn[standard]>=0.30,<1.0"
]

# pytesseract is deliberately absent. The provider drives the tesseract binary itself, because
# pytesseract splits its config string with shlex(posix=False) on Windows -- which makes
# --tessdata-dir unusable for any path containing a space, and the Sinhala language data lives
# under one. Driving the binary also lets the tessdata directory be passed through the child
# process's environment instead of this process's, and lets OCR_TIMEOUT_SECONDS actually kill a
# run.

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "ruff>=0.6,<1.0"
]
# Optional, and never imported unless OCR_PROVIDER=paddle_tesseract. PaddleOCR is a large native
# dependency that frequently fails to install on Windows; with it absent the hybrid degrades to
# whole-page Tesseract and says so on every result.
paddle = [
  "paddleocr>=2.7,<3.0",
  "numpy>=1.26,<3.0"
]

[tool.setuptools.packages.find]
where = ["src"]

# Prompt templates and manifests are data files. Without this they are absent from a built wheel, so the
# service works in an editable install and fails at runtime in a deployed container.
[tool.setuptools.package-data]
"media_service.llm.prompts" = ["**/*.txt", "**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# --basetemp: the default under %TEMP% is not writable in every environment here, which makes tmp_path
#   fixtures error before the test body runs.
# -m "not live": tests must never require a paid provider call (AC-016). Opt in with `-m live`.
addopts = [
  "--strict-markers",
  "--basetemp=.pytest-tmp",
  "-m",
  "not live",
]
markers = [
  "live: hits a real LLM or OCR provider; requires credentials and is excluded by default",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated by Alembic. Reformatting these by hand would be undone by the next `revision
# --autogenerate`, and a migration is a historical record rather than maintained source.
"migrations/versions/*.py" = ["E501", "I001"]
